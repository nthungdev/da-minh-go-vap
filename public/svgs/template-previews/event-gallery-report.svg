<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" fill="none">
  <!-- Background -->
  <rect width="300" height="200" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Event Header: Title & Subtitle -->
  <rect x="20" y="16" width="130" height="8" rx="4" fill="#1E293B"/>
  <rect x="20" y="28" width="180" height="5" rx="2.5" fill="#64748B"/>

  <!-- Narrative Text Paragraph -->
  <rect x="20" y="40" width="260" height="4" rx="2" fill="#94A3B8"/>
  <rect x="20" y="48" width="240" height="4" rx="2" fill="#94A3B8"/>

  <!-- Gallery Grid (2x2 / 3x2) with photo frames -->
  <rect x="20" y="60" width="82" height="52" rx="4" fill="#E2E8F0" stroke="#CBD5E1"/>
  <circle cx="34" cy="74" r="6" fill="#94A3B8"/>
  <polygon points="26,106 50,84 66,98 78,86 96,106" fill="#64748B"/>

  <rect x="109" y="60" width="82" height="52" rx="4" fill="#E2E8F0" stroke="#CBD5E1"/>
  <circle cx="123" cy="74" r="6" fill="#94A3B8"/>
  <polygon points="115,106 139,84 155,98 167,86 185,106" fill="#64748B"/>

  <rect x="198" y="60" width="82" height="52" rx="4" fill="#E2E8F0" stroke="#CBD5E1"/>
  <circle cx="212" cy="74" r="6" fill="#94A3B8"/>
  <polygon points="204,106 228,84 244,98 256,86 274,106" fill="#64748B"/>

  <!-- Gallery Row 2 -->
  <rect x="20" y="118" width="82" height="52" rx="4" fill="#E2E8F0" stroke="#CBD5E1"/>
  <circle cx="34" cy="132" r="6" fill="#94A3B8"/>
  <polygon points="26,164 50,142 66,156 78,144 96,164" fill="#64748B"/>

  <rect x="109" y="118" width="82" height="52" rx="4" fill="#E2E8F0" stroke="#CBD5E1"/>
  <circle cx="123" cy="132" r="6" fill="#94A3B8"/>
  <polygon points="115,164 139,142 155,156 167,144 185,164" fill="#64748B"/>

  <rect x="198" y="118" width="82" height="52" rx="4" fill="#E2E8F0" stroke="#CBD5E1"/>
  <circle cx="212" cy="132" r="6" fill="#94A3B8"/>
  <polygon points="204,164 228,142 244,156 256,144 274,164" fill="#64748B"/>

  <!-- Photo Captions Indicator -->
  <rect x="20" y="176" width="60" height="10" rx="3" fill="#F1F5F9"/>
  <!-- Media Credits -->
  <rect x="180" y="176" width="100" height="10" rx="3" fill="#E2E8F0"/>
