<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" fill="none">
  <!-- Background -->
  <rect width="300" height="200" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Centered Decorative Quote Mark Icon -->
  <circle cx="150" cy="28" r="14" fill="#6366F1" fill-opacity="0.12"/>
  <text x="144" y="36" font-family="serif" font-size="22" font-weight="bold" fill="#4F46E5">“</text>

  <!-- Two Parallel Columns Container -->
  <rect x="20" y="50" width="260" height="96" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  
  <!-- Left Column: English Original -->
  <rect x="28" y="58" width="55" height="12" rx="4" fill="#EEF2FF"/>
  <rect x="34" y="62" width="43" height="4" rx="2" fill="#4F46E5"/>
  <rect x="28" y="78" width="112" height="4" rx="2" fill="#334155"/>
  <rect x="28" y="86" width="108" height="4" rx="2" fill="#334155"/>
  <rect x="28" y="94" width="114" height="4" rx="2" fill="#334155"/>
  <rect x="28" y="102" width="90" height="4" rx="2" fill="#334155"/>
  <rect x="28" y="118" width="60" height="10" rx="3" fill="#F8FAFC"/>

  <!-- Vertical Divider Line -->
  <line x1="150" y1="58" x2="150" y2="138" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Right Column: Vietnamese Translation -->
  <rect x="160" y="58" width="58" height="12" rx="4" fill="#FEF3C7"/>
  <rect x="166" y="62" width="46" height="4" rx="2" fill="#D97706"/>
  <rect x="160" y="78" width="112" height="4" rx="2" fill="#1E293B"/>
  <rect x="160" y="86" width="106" height="4" rx="2" fill="#1E293B"/>
  <rect x="160" y="94" width="114" height="4" rx="2" fill="#1E293B"/>
  <rect x="160" y="102" width="85" height="4" rx="2" fill="#1E293B"/>
  <rect x="160" y="118" width="60" height="10" rx="3" fill="#F8FAFC"/>

  <!-- Bottom Centered Author & Source Badge -->
  <rect x="80" y="156" width="140" height="28" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
  <rect x="110" y="162" width="80" height="6" rx="3" fill="#1E293B"/>
  <rect x="95" y="172" width="110" height="4" rx="2" fill="#64748B"/>
</svg>
