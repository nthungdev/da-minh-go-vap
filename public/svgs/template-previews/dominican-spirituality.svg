<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" fill="none">
  <!-- Background -->
  <rect width="300" height="200" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Dominican Cross Header / Emblem -->
  <circle cx="32" cy="24" r="10" fill="#0F172A"/>
  <!-- Dominican Star / Cross -->
  <path d="M32 17 L34 22 L39 24 L34 26 L32 31 L30 26 L25 24 L30 22 Z" fill="#FFFFFF"/>
  
  <rect x="50" y="16" width="130" height="8" rx="4" fill="#0F172A"/>
  <rect x="50" y="27" width="90" height="5" rx="2.5" fill="#64748B"/>

  <!-- Lead Text Section -->
  <rect x="20" y="42" width="260" height="4" rx="2" fill="#475569"/>
  <rect x="20" y="50" width="240" height="4" rx="2" fill="#475569"/>

  <!-- Reflection Points Container -->
  <!-- Point 1 -->
  <rect x="20" y="62" width="260" height="42" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <!-- Dominican Diamond Bullet (❖) -->
  <polygon points="32,71 36,75 32,79 28,75" fill="#0F172A"/>
  <rect x="42" y="71" width="100" height="6" rx="3" fill="#0F172A"/>
  <rect x="42" y="82" width="228" height="4" rx="2" fill="#64748B"/>
  <rect x="42" y="90" width="180" height="4" rx="2" fill="#64748B"/>

  <!-- Point 2 with Highlight Quote -->
  <rect x="20" y="110" width="260" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <polygon points="32,119 36,123 32,127 28,123" fill="#0F172A"/>
  <rect x="42" y="119" width="115" height="6" rx="3" fill="#0F172A"/>
  <rect x="42" y="129" width="228" height="4" rx="2" fill="#64748B"/>
  <!-- Highlight quote callout -->
  <rect x="42" y="137" width="228" height="15" rx="3" fill="#FEF3C7" stroke="#FDE68A"/>
  <rect x="48" y="142" width="170" height="4" rx="2" fill="#B45309"/>

  <!-- Closing Prayer & Author Affiliation -->
  <rect x="20" y="166" width="150" height="18" rx="4" fill="#F1F5F9"/>
  <rect x="26" y="172" width="130" height="5" rx="2.5" fill="#64748B"/>
  <rect x="180" y="166" width="100" height="18" rx="4" fill="#E2E8F0"/>
  <rect x="188" y="172" width="84" height="5" rx="2.5" fill="#475569"/>
</svg>
