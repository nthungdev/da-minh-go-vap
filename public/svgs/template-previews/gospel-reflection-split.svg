  <!-- Prayer Box inside left col -->
  <rect x="24" y="112" width="146" height="34" rx="4" fill="#F1F5F9"/>
  <rect x="30" y="118" width="50" height="5" rx="2.5" fill="#64748B"/>
  <rect x="30" y="127" width="134" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="30" y="135" width="110" height="4" rx="2" fill="#CBD5E1"/>

  <!-- Right Col: Gospel Reading (40%) -->
  <rect x="184" y="56" width="100" height="98" rx="6" fill="#FFFBEB" stroke="#FCD34D"/>
  <rect x="192" y="64" width="50" height="7" rx="3.5" fill="#B45309"/>
  <rect x="192" y="75" width="84" height="4" rx="2" fill="#D97706" fill-opacity="0.7"/>
  <rect x="192" y="83" width="80" height="4" rx="2" fill="#D97706" fill-opacity="0.7"/>
