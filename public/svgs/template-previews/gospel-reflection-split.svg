  <rect x="192" y="107" width="80" height="4" rx="2" fill="#D97706" fill-opacity="0.7"/>
  <rect x="192" y="115" width="60" height="4" rx="2" fill="#D97706" fill-opacity="0.7"/>
  <!-- Translation Credit -->
  <rect x="192" y="136" width="75" height="10" rx="3" fill="#FEF3C7"/>

  <!-- Bottom Footer / Author & Unit -->
  <rect x="16" y="162" width="90" height="12" rx="4" fill="#E2E8F0"/>
  <rect x="112" y="162" width="110" height="12" rx="4" fill="#E2E8F0"/>
