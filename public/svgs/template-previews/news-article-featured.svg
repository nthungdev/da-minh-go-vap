<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" fill="none">
  <!-- Background -->
  <rect width="300" height="200" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Category Pill / Header -->
  <rect x="20" y="16" width="70" height="12" rx="6" fill="#3B82F6" fill-opacity="0.15"/>
  <rect x="28" y="19" width="54" height="6" rx="3" fill="#2563EB"/>

  <!-- Left Float: Featured Image Block with Caption -->
  <rect x="20" y="36" width="115" height="110" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <!-- Image thumbnail -->
  <rect x="26" y="42" width="103" height="74" rx="4" fill="#E2E8F0"/>
  <circle cx="50" cy="62" r="9" fill="#CBD5E1"/>
  <polygon points="32,104 68,68 92,92 110,74 122,104" fill="#94A3B8"/>
  <!-- Caption text lines -->
  <rect x="26" y="122" width="90" height="4" rx="2" fill="#64748B"/>
  <rect x="26" y="130" width="60" height="4" rx="2" fill="#94A3B8"/>
  <rect x="26" y="138" width="40" height="3" rx="1.5" fill="#CBD5E1"/>

  <!-- Right: Flowing Article Text Lines -->
  <rect x="146" y="36" width="134" height="6" rx="3" fill="#1E293B"/>
  <rect x="146" y="48" width="128" height="4" rx="2" fill="#64748B"/>
  <rect x="146" y="56" width="134" height="4" rx="2" fill="#64748B"/>
  <rect x="146" y="64" width="120" height="4" rx="2" fill="#64748B"/>
  <rect x="146" y="72" width="130" height="4" rx="2" fill="#64748B"/>
  <rect x="146" y="80" width="134" height="4" rx="2" fill="#64748B"/>
  <rect x="146" y="88" width="115" height="4" rx="2" fill="#64748B"/>
  <rect x="146" y="96" width="128" height="4" rx="2" fill="#64748B"/>
  <rect x="146" y="104" width="132" height="4" rx="2" fill="#64748B"/>
  <rect x="146" y="112" width="125" height="4" rx="2" fill="#64748B"/>
  <rect x="146" y="120" width="134" height="4" rx="2" fill="#64748B"/>
  <rect x="146" y="128" width="118" height="4" rx="2" fill="#64748B"/>
  <rect x="146" y="136" width="130" height="4" rx="2" fill="#64748B"/>

  <!-- Bottom Full-Width Paragraph -->
  <rect x="20" y="154" width="260" height="4" rx="2" fill="#64748B"/>
  <rect x="20" y="162" width="230" height="4" rx="2" fill="#64748B"/>

  <!-- Source Citation Badge at Bottom Right -->
  <rect x="175" y="174" width="105" height="14" rx="7" fill="#F1F5F9" stroke="#E2E8F0"/>
  <rect x="185" y="179" width="85" height="4" rx="2" fill="#475569"/>
</svg>
