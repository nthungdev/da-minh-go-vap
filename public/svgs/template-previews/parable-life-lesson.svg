<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" fill="none">
  <!-- Background -->
  <rect width="300" height="200" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Header: Parable Category Tag -->
  <rect x="20" y="14" width="80" height="12" rx="6" fill="#F59E0B" fill-opacity="0.15"/>
  <rect x="28" y="17" width="64" height="6" rx="3" fill="#D97706"/>

  <!-- Body Paragraph -->
  <rect x="20" y="32" width="260" height="4" rx="2" fill="#64748B"/>
  <rect x="20" y="40" width="245" height="4" rx="2" fill="#64748B"/>
  <rect x="20" y="48" width="255" height="4" rx="2" fill="#64748B"/>

  <!-- Embedded Scripture Quote Block -->
  <rect x="20" y="58" width="260" height="34" rx="4" fill="#FFFBEB" stroke="#FCD34D"/>
  <!-- Quote mark -->
  <text x="28" y="78" font-family="serif" font-size="22" font-weight="bold" fill="#D97706">“</text>
  <rect x="42" y="66" width="200" height="4" rx="2" fill="#B45309"/>
  <rect x="42" y="74" width="160" height="4" rx="2" fill="#B45309"/>
  <rect x="42" y="82" width="50" height="4" rx="2" fill="#F59E0B"/>

  <!-- More Story Narrative -->
  <rect x="20" y="98" width="260" height="4" rx="2" fill="#64748B"/>
  <rect x="20" y="106" width="230" height="4" rx="2" fill="#64748B"/>

  <!-- Callout / Life Lesson Box -->
  <rect x="20" y="118" width="260" height="46" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <!-- Lightbulb / Accent icon circle -->
  <circle cx="36" cy="134" r="8" fill="#3B82F6"/>
  <path d="M34 130 C34 128, 38 128, 38 130 C38 132, 36 133, 36 135 M35 137 L37 137" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="52" y="128" width="80" height="5" rx="2.5" fill="#1D4ED8"/>
  <rect x="52" y="138" width="210" height="4" rx="2" fill="#3B82F6" fill-opacity="0.8"/>
  <rect x="52" y="146" width="180" height="4" rx="2" fill="#3B82F6" fill-opacity="0.8"/>

  <!-- Translator & External Source -->
  <rect x="20" y="174" width="90" height="12" rx="4" fill="#F1F5F9"/>
  <rect x="115" y="174" width="80" height="12" rx="4" fill="#F1F5F9"/>
</svg>
