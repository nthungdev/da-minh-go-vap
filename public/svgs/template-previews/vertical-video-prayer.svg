  <rect x="142" y="88" width="118" height="4" rx="2" fill="#94A3B8"/>
  <rect x="142" y="96" width="122" height="4" rx="2" fill="#94A3B8"/>
  <rect x="142" y="104" width="90" height="4" rx="2" fill="#94A3B8"/>
  <rect x="142" y="114" width="40" height="6" rx="3" fill="#EF4444" fill-opacity="0.2"/>

