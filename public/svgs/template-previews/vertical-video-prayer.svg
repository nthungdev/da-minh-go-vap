  <polygon points="68,91 78,98 68,105" fill="#FFFFFF"/>
  <!-- 9:16 Badge -->
  <rect x="56" y="152" width="30" height="10" rx="5" fill="#000000" fill-opacity="0.6"/>
  <rect x="62" y="155" width="18" height="4" rx="2" fill="#FFFFFF"/>

  <!-- Right: Intention Prayer & Scripture -->
